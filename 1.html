<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>
</head>
<body>

<h1>Welcome to My Web Page</h1>
<p>This is a <b>basic HTML</b> page.</p>

<h2>Text Formatting</h2>
<p><i>Italic</i>, <u>Underline</u>, <strong>Strong</strong>, H<sub>2</sub>O, X<sup>2</sup></p>

<h2>Image</h2>
<img src="https://via.placeholder.com/200" alt="Sample Image">

<h2>Link</h2>
<a href="https://www.google.com" target="_blank">Visit Google</a>

<h2>List</h2>
<ul>
    <li>HTML</li>
    <li>CSS</li>
</ul>

<h2>Table</h2>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Course</th>
    </tr>
    <tr>
        <td>John</td>
        <td>HTML</td>
    </tr>
</table>

<h2>Form</h2>
<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    <input type="submit">
</form>

<div style="background-color: lightgray;">
    This is a div section
</div>

<p>This is <span style="color: red;">important</span> text.</p>

</body>
</html>
